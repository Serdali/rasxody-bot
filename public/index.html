<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои платежи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--line:#e5e7eb;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--warn:#d97706;--warnbg:#fef3c7;--acc:#2563eb}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mut:#9aa3b2;--line:#2a2f39;--okbg:#12301d;--badbg:#3a1616;--warnbg:#3a2a0e;--acc:#60a5fa}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav h1{font-size:20px;margin:0;text-transform:capitalize}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--tx);width:42px;height:42px;border-radius:12px;font-size:20px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.sum small{display:block;color:var(--mut);font-size:13px}.sum b{font-size:18px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:16px;padding:14px;margin-bottom:12px}
.item.paid{border-left-color:var(--ok);opacity:.85}.item.over{border-left-color:var(--bad)}.item.soon{border-left-color:var(--warn)}
.top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:650;font-size:17px}.amt{font-weight:700;font-size:17px;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px;margin:6px 0 12px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-n{background:var(--line);color:var(--mut)}
.row{display:flex;gap:8px}
.pay{flex:1;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;background:var(--ok);color:#fff}
.pay.undo{background:var(--line);color:var(--mut);font-weight:600;font-size:15px}
.ed{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:12px;width:52px;font-size:18px}
.add{width:100%;padding:14px;border-radius:14px;border:2px dashed var(--line);background:transparent;color:var(--acc);font-size:16px;font-weight:600}
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.form label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx)}
.form .row{margin-top:12px}.form button{flex:1;padding:12px;border-radius:10px;border:0;font-size:16px;font-weight:600}
.save{background:var(--acc);color:#fff}.cancel{background:var(--line);color:var(--tx)}.del{background:var(--badbg);color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
</style></head>
<body><div class="wrap">
<div class="nav"><button id="prev">‹</button><h1 id="title"></h1><button id="next">›</button></div>
<div class="sum" id="sum"></div><div id="list"></div><div id="formbox"></div>
<button class="add" id="addbtn">+ Добавить платёж</button>
</div>
<script>
var tg=window.Telegram&&Telegram.WebApp,INIT=tg?tg.initData:"";
if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme}
function api(m,p,b){return fetch("/api/"+p,{method:m,headers:{"x-init":INIT,"content-type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){if(!r.ok)throw 0;return r.json()})}
var now=new Date(),view=new Date(now.getFullYear(),now.getMonth(),1),data={items:[],paid:[]},editing=null;
function mk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function fmt(n){return Number(n).toLocaleString("ru-RU")+" сум"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function dueDate(it){var l=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();return new Date(view.getFullYear(),view.getMonth(),Math.min(it.day,l))}
function load(){return api("GET","data?ym="+mk(view)).then(function(d){data=d;render()}).catch(function(){document.getElementById("list").innerHTML='<div class="empty">Откройте приложение через Telegram-бота</div>'})}
function render(){
  document.getElementById("title").textContent=view.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  var P=data.paid,items=data.items.slice().sort(function(a,b){return (P.includes(a.id)?1:0)-(P.includes(b.id)?1:0)||a.day-b.day}),total=0,left=0;
  data.items.forEach(function(i){total+=i.amount;if(!P.includes(i.id))left+=i.amount});
  document.getElementById("sum").innerHTML='<div><small>Осталось оплатить</small><b>'+fmt(left)+'</b></div><div style="text-align:right"><small>Всего за месяц</small><b>'+fmt(total)+'</b></div>';
  var h=items.length?"":'<div class="empty">Пока нет платежей. Добавьте первый ↓</div>';
  items.forEach(function(it){
    var d=dueDate(it),diff=Math.round((d-today())/864e5),p=P.includes(it.id),cls="",b;
    if(p){cls="paid";b='<span class="badge b-ok">Оплачено ✓</span>'}
    else if(diff<0){cls="over";b='<span class="badge b-bad">Просрочено на '+(-diff)+' дн.</span>'}
    else if(diff===0){cls="soon";b='<span class="badge b-warn">Сегодня!</span>'}
    else if(diff<=3){cls="soon";b='<span class="badge b-warn">Через '+diff+' дн.</span>'}
    else b='<span class="badge b-n">Через '+diff+' дн.</span>';
    h+='<div class="item '+cls+'"><div class="top"><div class="name">'+esc(it.name)+'</div><div class="amt">'+fmt(it.amount)+'</div></div><div class="meta">До '+d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})+' '+b+'</div><div class="row"><button class="pay'+(p?" undo":"")+'" data-pay="'+it.id+'">'+(p?"Отменить отметку":"✓ Оплачено")+'</button><button class="ed" data-ed="'+it.id+'">✎</button></div></div>';
  });
  document.getElementById("list").innerHTML=h;
}
function showForm(id){
  editing=id;var it=data.items.find(function(i){return i.id==id})||{name:"",day:"",amount:""};
  document.getElementById("formbox").innerHTML='<div class="form"><label>Название</label><input id="fn" value="'+esc(it.name)+'" placeholder="Например: Коммуналка"><label>День месяца (1–31)</label><input id="fd" type="number" min="1" max="31" inputmode="numeric" value="'+it.day+'"><label>Сумма (сум)</label><input id="fa" type="number" min="0" inputmode="numeric" value="'+it.amount+'"><div class="row"><button class="save" id="fs">Сохранить</button><button class="cancel" id="fc">Отмена</button></div>'+(id?'<div class="row"><button class="del" id="fx">Удалить платёж</button></div>':'')+'</div>';
  document.getElementById("addbtn").style.display="none";
}
function hideForm(){document.getElementById("formbox").innerHTML="";document.getElementById("addbtn").style.display="";editing=null}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.pay){var id=+t.dataset.pay;api("POST","paid",{id:id,ym:mk(view),paid:!data.paid.includes(id)}).then(load)}
  else if(t.dataset.ed)showForm(t.dataset.ed);
  else if(t.id==="addbtn")showForm(null);
  else if(t.id==="fc")hideForm();
  else if(t.id==="fs"){
    var n=document.getElementById("fn").value.trim(),d=parseInt(document.getElementById("fd").value),a=parseFloat(document.getElementById("fa").value);
    if(!n||!(d>=1&&d<=31)||isNaN(a))return;
    api("POST","items",{id:editing,name:n,day:d,amount:a}).then(function(){hideForm();load()});
  }
  else if(t.id==="fx"){
    if(t.dataset.sure)api("DELETE","items/"+editing).then(function(){hideForm();load()});
    else{t.dataset.sure="1";t.textContent="Нажмите ещё раз для удаления"}
  }
  else if(t.id==="prev"){view=new Date(view.getFullYear(),view.getMonth()-1,1);load()}
  else if(t.id==="next"){view=new Date(view.getFullYear(),view.getMonth()+1,1);load()}
});
load();
</script></body></html>
